<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Crown Survivors Stats</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎃</text></svg>">
<style>
/* Admin dashboard over the telemetry tables (docs/telemetry.md). Data from GET /api/admin/stats. */
:root{
  color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--surface-2:#f0efec;
  --ink:#0b0b0b;--ink-2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);
  --classic:#2a78d6;--halloween:#eb6834;
  --accent:#eb6834;--good:#006300;--critical:#d03b3b;
  --tip-bg:#0b0b0b;--tip-ink:#f0efec;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d;--surface:#1a1a19;--surface-2:#262624;
    --ink:#f0efec;--ink-2:#c3c2b7;--muted:#898781;
    --grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);
    --classic:#3987e5;--halloween:#d95926;
    --accent:#d95926;--good:#0ca30c;
    --tip-bg:#f0efec;--tip-ink:#0b0b0b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--surface-2:#262624;
  --ink:#f0efec;--ink-2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);
  --classic:#3987e5;--halloween:#d95926;
  --accent:#d95926;--good:#0ca30c;
  --tip-bg:#f0efec;--tip-ink:#0b0b0b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;margin-bottom:20px}
h1{font-size:20px;font-weight:650;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--ink-2);letter-spacing:0;margin-top:2px}
.who{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px}
.who img{width:24px;height:24px;border-radius:50%}
.env{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--ring);color:var(--ink-2);white-space:nowrap}
.env.nonprod{background:var(--accent);border-color:var(--accent);color:#fff}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:20px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:2px}
.seg button{border:0;background:none;color:var(--ink-2);font:inherit;font-size:13px;padding:6px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--ring)}
.btn{border:1px solid var(--ring);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:var(--page);border-color:var(--ink)}
.spacer{flex:1}
.stamp{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border-radius:12px;box-shadow:0 0 0 1px var(--ring);padding:18px;min-width:0}
.card h2{font-size:14px;font-weight:600;margin:0}
.card .sub{font-size:12px;color:var(--ink-2);margin:2px 0 12px}
.top{display:grid;grid-template-columns:minmax(260px,1.1fr) 2fr;gap:16px;margin-bottom:16px}
.hero .label{font-size:13px;color:var(--ink-2)}
.hero .value{font-size:56px;font-weight:650;line-height:1.05;letter-spacing:-.02em;margin:6px 0 4px}
.hero .note{font-size:12px;color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--ring);border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--ring)}
.tile{background:var(--surface);padding:14px 16px}
.tile .label{font-size:12px;color:var(--ink-2)}
.tile .value{font-size:22px;font-weight:600;margin-top:2px}
.tile .note{font-size:11px;color:var(--muted);margin-top:1px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid .wide{grid-column:1/-1}
.section{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:28px 0 10px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart.scroll{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2);margin:-4px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty{height:180px;display:grid;place-items:center;color:var(--muted);font-size:13px;background:var(--surface-2);border-radius:8px}
details.tbl{margin-top:10px;font-size:12px}
details.tbl summary{color:var(--ink-2);cursor:pointer;width:max-content}
details.tbl .tw{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:5px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--ink-2)}
.tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.lbl{fill:var(--ink-2);font-size:12px}
.val{fill:var(--ink);font-size:12px;font-weight:600}
#tip{position:fixed;pointer-events:none;z-index:10;background:var(--tip-bg);color:var(--tip-ink);font-size:12px;line-height:1.4;padding:8px 10px;border-radius:8px;max-width:260px;opacity:0;transition:opacity .08s;box-shadow:0 4px 16px rgba(0,0,0,.18)}
#tip .t{font-weight:600;margin-bottom:2px}
#tip .r{display:flex;align-items:center;gap:6px;justify-content:space-between}
#tip .r span:first-child{display:flex;align-items:center;gap:6px}
#tip i{display:inline-block;width:8px;height:8px;border-radius:2px}
#tip b{font-weight:600;font-variant-numeric:tabular-nums}
.signed-out header,.signed-out .controls{display:none}
.gate{max-width:440px;margin:60px auto;text-align:center}
.gate h2{font-size:18px;margin:0 0 8px}
.gate p{color:var(--ink-2);margin:0 0 18px}
.gate .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.gate input{border:1px solid var(--ring);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;min-width:220px}
.gate .msg{margin:14px 0 0;font-size:13px}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);padding:1px 5px;border-radius:4px}
/* players and profiles */
a{color:inherit}
.muted{color:var(--muted)}
.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.pbar input{border:1px solid var(--ring);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;padding:6px 10px;border-radius:8px}
.pbar input[type=search]{flex:1;min-width:220px;max-width:380px}
.pgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.card .seg{margin-bottom:10px}
.tw{overflow-x:auto}
tr.link{cursor:pointer}
tr.link:hover td{background:var(--surface-2)}
tr.link a{text-decoration:none}
.pl{display:inline-flex;align-items:center;gap:8px}
.pl img,.av{width:24px;height:24px;border-radius:50%;flex:none;display:inline-block;background:var(--surface-2);object-fit:cover}
.av.anon{background:repeating-linear-gradient(45deg,var(--surface-2) 0 4px,var(--grid) 4px 8px)}
.phead{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.phead img.big,.phead .av.big{width:64px;height:64px}
.phead h2{font-size:18px}
.phead .sub{margin:2px 0 0}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);margin-left:8px;vertical-align:2px}
.back{font-size:13px;color:var(--ink-2)}
.note{font-size:12px;color:var(--ink-2);margin:0 0 12px}
.meter{display:inline-block;width:80px;height:6px;border-radius:3px;background:var(--surface-2);vertical-align:1px;margin-left:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--classic);border-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;box-shadow:0 0 0 1px var(--ring)}
.chip.off{color:var(--muted);box-shadow:none;background:var(--surface-2)}
@media (max-width:900px){.pgrid{grid-template-columns:1fr}}
@media (max-width:900px){.top{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.hero .value{font-size:48px}.seg button{padding:6px 9px}}
</style>
</head>
<body class="signed-out">
<div class="wrap">
  <header>
    <h1>Crown Survivors stats<small>Players, runs and progression from first-party telemetry</small></h1>
    <div class="who"><span class="env" id="env" hidden></span><span class="who" id="who"></span></div>
  </header>
  <div class="controls">
    <div class="seg" id="tabs" role="group" aria-label="View"><button data-v="overview">Overview</button><button data-v="players">Players</button></div>
    <div class="seg" id="ranges" role="group" aria-label="Date range"></div>
    <span class="spacer"></span>
    <span class="stamp" id="stamp"></span>
    <button class="btn" id="refresh">Refresh</button>
  </div>
  <main id="main"></main>
</div>
<div id="tip" role="tooltip"></div>
<script>
(()=>{
// ===== config =====
const API='/api',TZ='Africa/Johannesburg';
const EVENT={id:'harvest-2026',name:'Harvest Moon',from:'2026-10-28',to:'2026-11-08'}; // keep in sync with api/src/events.ts
const RANGES=[{k:'event',n:EVENT.name},{k:'7',n:'7 days'},{k:'30',n:'30 days'},{k:'90',n:'90 days'}];
// shop upgrades in game order, with max level (META in index.html)
const META=[['might','Might',10],['hp','Vitality',10],['armor','Plating',3],['speed','Swiftness',5],['magnet','Attraction',5],['greed','Greed',5],['reroll','Reroll',3],['choice','Insight',1],['revive','Revive',1]];
const CAUSE={horde:'Horde',boss:'Ritual boss',gourd:'Night Gourd',other:'Other'};
const SEQ=['#cde2fb','#b7d3f6','#9ec5f4','#86b6ef','#6da7ec','#5598e7','#3987e5','#2a78d6','#256abf','#1c5cab','#184f95','#104281','#0d366b'];
const ORD=['#1c5cab','#256abf','#2a78d6','#5598e7','#86b6ef']; // ordinal ramp for the funnel (steps 550 -> 250)

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const qs=new URLSearchParams(location.search);
const st={range:store.get('cs_admin_range')||'event',data:null,view:'overview',q:'',day:'',board:'fastest',profile:null,dev:0};

// ===== formatting =====
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=n=>Math.round(n).toLocaleString('en-US');
const fmtC=n=>{const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'')+'M':a>=1e4?(n/1e3).toFixed(a>=1e5?0:1).replace(/\.0$/,'')+'K':fmtN(n)};
const fmtP=x=>(x*100).toFixed(x>0&&x<.1?1:0)+'%';
const fmtDur=s=>{s=Math.round(s);const m=Math.floor(s/60);return m?m+'m '+String(s%60).padStart(2,'0')+'s':s+'s'};
const dayLbl=d=>new Date(d+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
const heroLbl=h=>h.split('-').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date());
const addDays=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
function rangeDates(k){if(k==='event')return{from:EVENT.from,to:EVENT.to};const to=addDays(today(),1);return{from:addDays(to,-Number(k)),to}}

// ===== auth: Better Auth magic link to an ADMIN_EMAILS address; the session is a first-party cookie =====
async function api(path,body){const o={credentials:'include'};if(body)Object.assign(o,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  try{const r=await fetch(API+path,o);let j=null;try{j=await r.json()}catch(e){}return{status:r.status,j}}catch(e){return{status:0,j:null}}}
// The verify link lands back here with ?error=... when it is expired or already used.
const linkErr=qs.get('error');
if(linkErr){const u=new URL(location.href);u.searchParams.delete('error');try{history.replaceState(null,'',u)}catch(e){}}
async function sendLink(f){const email=f.email.value.trim(),msg=f.querySelector('.msg'),btn=f.querySelector('button');if(!email)return;
  btn.disabled=true;msg.textContent='Sending…';
  // Relative, so the link lands on the host that just set the cookie (preview links use the branch URL).
  const back=location.pathname;
  const r=await api('/auth/sign-in/magic-link',{email,callbackURL:back,errorCallbackURL:back});
  btn.disabled=false;
  msg.textContent=r.status===200?'Sent'
    :r.status===429?'Too many tries. Wait a minute and try again.':'Could not send the link. Try again.'}
async function signOut(){await api('/auth/sign-out',{});document.getElementById('who').innerHTML='';load()}

// ===== tooltip =====
const tip=document.getElementById('tip');
function showTip(html,x,y){tip.innerHTML=html;tip.style.opacity=1;const w=tip.offsetWidth,h=tip.offsetHeight;
  let l=x+14,t=y+14;if(l+w>innerWidth-8)l=x-w-14;if(t+h>innerHeight-8)t=y-h-14;tip.style.left=Math.max(8,l)+'px';tip.style.top=Math.max(8,t)+'px'}
const hideTip=()=>{tip.style.opacity=0};
const tipRows=(title,rows)=>'<div class="t">'+esc(title)+'</div>'+rows.map(([c,k,v])=>'<div class="r"><span>'+(c?'<i style="background:'+c+'"></i>':'')+esc(k)+'</span><b>'+esc(v)+'</b></div>').join('');
document.addEventListener('pointermove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el.dataset.tip,e.clientX,e.clientY);else if(!e.target.closest('.xh'))hideTip()});
document.addEventListener('pointerleave',hideTip);

// ===== chart helpers (inline SVG) =====
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function niceMax(v,ticks=4){if(v<=0)return 1;const raw=v/ticks,p=Math.pow(10,Math.floor(Math.log10(raw))),s=[1,2,2.5,5,10].map(m=>m*p).find(m=>m>=raw);return s*ticks}
// rect with 4px rounded data-end; dir 'up' (column) or 'right' (bar)
function rpath(x,y,w,h,dir,r=4){r=Math.min(r,dir==='up'?h:w,dir==='up'?w/2:h/2);if(w<=0||h<=0)return'';
  return dir==='up'?`M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`
    :`M${x},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h-r}Q${x+w},${y+h} ${x+w-r},${y+h}H${x}Z`}
const legend=items=>'<div class="legend">'+items.map(([c,n])=>'<span><i style="background:'+c+'"></i>'+esc(n)+'</span>').join('')+'</div>';
const empty=msg=>'<div class="empty">'+esc(msg||'No data in this range yet')+'</div>';
function table(cols,rows){return'<details class="tbl"><summary>Show table</summary><div class="tw"><table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+
  rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></details>'}
function yAxis(max,x0,x1,y0,h){let s='';for(let i=0;i<=4;i++){const v=max*i/4,y=y0+h-h*i/4;
  s+=`<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="${i?'var(--grid)':'var(--axis)'}" stroke-width="1"/><text class="tick" x="${x0-8}" y="${y+4}" text-anchor="end">${fmtC(v)}</text>`}return s}
function xLabels(labels,xAt,y,plotW){const every=Math.max(1,Math.ceil(labels.length*56/plotW));let s='';
  labels.forEach((l,i)=>{if(i%every===0)s+=`<text class="tick" x="${xAt(i)}" y="${y}" text-anchor="middle">${esc(l)}</text>`});return s}

// line chart with crosshair; series: [{name,color,values}]
const LC={};
function lineChart(id,labels,series,H=220){const el=document.getElementById(id),W=el.clientWidth||600,m={l:44,r:series.length>1?96:16,t:10,b:26},pw=W-m.l-m.r,ph=H-m.t-m.b;
  const max=niceMax(Math.max(1,...series.flatMap(s=>s.values))),n=labels.length,xAt=i=>m.l+(n<2?pw/2:pw*i/(n-1)),yAt=v=>m.t+ph-ph*v/max;
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(series.map(x=>x.name).join(', '))} by day">`+yAxis(max,m.l,m.l+pw,m.t,ph)+xLabels(labels,xAt,H-6,pw);
  for(const se of series){s+=`<path d="${se.values.map((v,i)=>(i?'L':'M')+xAt(i).toFixed(1)+','+yAt(v).toFixed(1)).join('')}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`}
  // direct end labels, unless they would collide (the legend still carries identity)
  const ends=series.map(se=>({se,y:yAt(se.values[n-1]||0)}));
  if(series.length>1&&ends.every((a,i)=>ends.every((b,k)=>k===i||Math.abs(a.y-b.y)>=14)))
    for(const {se,y} of ends)s+=`<circle cx="${xAt(n-1)}" cy="${y}" r="4" fill="${se.color}" stroke="var(--surface)" stroke-width="2"/><text class="lbl" x="${xAt(n-1)+10}" y="${y+4}">${esc(se.name)}</text>`;
  s+=`<g class="xg" style="display:none"><line class="xl" y1="${m.t}" y2="${m.t+ph}" stroke="var(--axis)" stroke-width="1"/>${series.map(se=>`<circle r="4" fill="${se.color}" stroke="var(--surface)" stroke-width="2"/>`).join('')}</g>`;
  s+=`<rect class="xh" x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="transparent"/></svg>`;
  el.innerHTML=s;LC[id]={labels,series,xAt,yAt,n,m,pw};
  const svg=el.querySelector('svg'),g=svg.querySelector('.xg'),hit=svg.querySelector('.xh');
  hit.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width,i=Math.max(0,Math.min(n-1,Math.round((px-m.l)/pw*(n-1))));
    g.style.display='';const x=xAt(i);g.querySelector('.xl').setAttribute('x1',x);g.querySelector('.xl').setAttribute('x2',x);
    g.querySelectorAll('circle').forEach((c,k)=>{c.setAttribute('cx',x);c.setAttribute('cy',yAt(series[k].values[i]))});
    showTip(tipRows(labels[i],series.map(se=>[se.color,se.name,fmtN(se.values[i])])),e.clientX,e.clientY)});
  hit.addEventListener('pointerleave',()=>{g.style.display='none';hideTip()})}

// stacked columns; series: [{name,color,values}]
function columnChart(id,labels,series,opt={}){const el=document.getElementById(id),W=el.clientWidth||600,H=opt.h||220,m={l:44,r:12,t:10,b:26},pw=W-m.l-m.r,ph=H-m.t-m.b,n=labels.length;
  const tot=labels.map((_,i)=>series.reduce((a,se)=>a+se.values[i],0)),max=niceMax(Math.max(1,...tot)),band=pw/n,bw=Math.max(2,Math.min(24,band-2)),xAt=i=>m.l+band*i+band/2,hOf=v=>ph*v/max;
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(opt.label||'')}">`+yAxis(max,m.l,m.l+pw,m.t,ph)+xLabels(labels,xAt,H-6,pw);
  labels.forEach((l,i)=>{let y=m.t+ph;const top=series.map((se,k)=>se.values[i]>0?k:-1).filter(k=>k>=0).pop();
    series.forEach((se,k)=>{const v=se.values[i];if(!v)return;const h=hOf(v);y-=h;
      // 2px surface gap between stacked segments
      const hh=Math.max(.5,h-(k===top?0:2));s+=`<path d="${k===top?rpath(xAt(i)-bw/2,y,bw,hh,'up'):`M${xAt(i)-bw/2},${y+(h-hh)}h${bw}v${hh}h${-bw}Z`}" fill="${se.color}"/>`});
    const rows=series.map(se=>[se.color,se.name,fmtN(se.values[i])]);if(series.length>1)rows.push(['','Total',fmtN(tot[i])]);
    s+=`<rect x="${m.l+band*i}" y="${m.t}" width="${band}" height="${ph}" fill="transparent" data-tip="${esc(tipRows(opt.tipTitle?opt.tipTitle(i):l,rows))}"/>`});
  el.innerHTML=s+'</svg>'}

// horizontal bars; rows: [{label,value,color,tip,valueText}]
function barChart(id,rows,opt={}){const el=document.getElementById(id),W=el.clientWidth||600,lw=opt.labelW||150,vw=opt.valueW||90,rh=30,bh=16,H=rows.length*rh+4,pw=Math.max(40,W-lw-vw);
  const max=opt.max||Math.max(1,...rows.map(r=>r.value));
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(opt.label||'')}"><line x1="${lw}" x2="${lw}" y1="0" y2="${H}" stroke="var(--axis)"/>`;
  rows.forEach((r,i)=>{const y=i*rh+(rh-bh)/2,w=Math.max(r.value?2:0,pw*r.value/max);
    s+=`<text class="lbl" x="${lw-10}" y="${y+bh/2+4}" text-anchor="end">${esc(r.label)}</text><path d="${rpath(lw,y,w,bh,'right')}" fill="${r.color}"/>`+
      `<text class="val" x="${lw+w+8}" y="${y+bh/2+4}">${esc(r.valueText||fmtN(r.value))}</text>`+
      `<rect x="0" y="${i*rh}" width="${W}" height="${rh}" fill="transparent" data-tip="${esc(r.tip||tipRows(r.label,[[r.color,'Value',fmtN(r.value)]]))}"/>`});
  el.innerHTML=s+'</svg>'}

// upgrade heatmap: rows = upgrades, cols = levels, cell = share of players at that level
function heatmap(id,p){const el=document.getElementById(id),by={};for(const u of p.upgrades)(by[u.upgrade]=by[u.upgrade]||{})[u.level]=u.n;
  // low shares recede toward the surface: light steps on light, dark steps on dark
  const dark=css('color-scheme')==='dark',maxL=Math.max(...META.map(x=>x[2])),lw=96,cw=Math.max(34,Math.min(64,((el.clientWidth||600)-lw)/(maxL+1))),ch=28,W=lw+cw*(maxL+1),H=META.length*ch+24;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="width:${W}px" role="img" aria-label="Share of players at each upgrade level">`;
  for(let l=0;l<=maxL;l++)s+=`<text class="tick" x="${lw+cw*l+cw/2}" y="14" text-anchor="middle">${l}</text>`;
  META.forEach(([k,name,max],r)=>{const row=by[k]||{},tot=Object.values(row).reduce((a,b)=>a+b,0)||1,y=20+r*ch;
    s+=`<text class="lbl" x="${lw-10}" y="${y+ch/2+4}" text-anchor="end">${esc(name)}</text>`;
    for(let l=0;l<=max;l++){const n=row[l]||0,sh=n/tot,step=Math.min(SEQ.length-1,Math.round(sh*(SEQ.length-1))),ci=n?(dark?SEQ.length-1-step:step):-1,fill=ci<0?'var(--surface-2)':SEQ[ci],x=lw+cw*l;
      s+=`<rect x="${x+1}" y="${y+1}" width="${cw-2}" height="${ch-2}" rx="3" fill="${fill}" data-tip="${esc(tipRows(name+' level '+l,[['','Players',fmtN(n)],['','Share',fmtP(sh)]]))}"/>`;
      if(cw>=40&&n)s+=`<text x="${x+cw/2}" y="${y+ch/2+4}" text-anchor="middle" font-size="11" fill="${ci>=7?'#ffffff':'#0b0b0b'}" pointer-events="none">${fmtP(sh)}</text>`}});
  el.innerHTML=s+'</svg>'}

function spark(id,values,color){const el=document.getElementById(id),W=el.clientWidth||240,H=40,max=Math.max(1,...values),n=values.length;if(n<2){el.innerHTML='';return}
  const xAt=i=>2+(W-6)*i/(n-1),yAt=v=>H-4-(H-8)*v/max;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" aria-hidden="true"><path d="${values.map((v,i)=>(i?'L':'M')+xAt(i).toFixed(1)+','+yAt(v).toFixed(1)).join('')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${xAt(n-1)}" cy="${yAt(values[n-1])}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2"/></svg>`}

  addTable('c-funnel',['Step','Players','Share'],d.funnel.map(s=>[s.stage,fmtN(s.n),d.funnel[0].n?fmtP(s.n/d.funnel[0].n):'']));

  addTable('c-gold',['Gold','Players'],p.gold_buckets.map(b=>[b.label,fmtN(b.n)]));
  addTable('c-codex',['Items seen','Players'],p.codex_buckets.map(b=>[b.label,fmtN(b.n)]));

const tile=(l,v,n)=>`<div class="tile"><div class="label">${esc(l)}</div><div class="value">${esc(v)}</div><div class="note">${esc(n||'')}</div></div>`;
const card=(id,t,sub,leg,cls)=>`<section class="card ${cls||''}"><h2>${esc(t)}</h2><div class="sub">${esc(sub)}</div>${leg?legend(leg):''}<div class="chart${id==='c-upg'?' scroll':''}" id="${id}"></div><div id="${id}-t"></div></section>`;

// Shared answer to a failed admin call. Returns true when it showed a gate instead of data.
function guard(r,what){
  // Signed out: only the sign-in card shows.
  document.body.classList.toggle('signed-out',r.status===401);
  if(r.status===401){gate('Sign in','',
    `<form data-link style="width:100%"><div class="row"><input type="email" name="email" required autocomplete="email" placeholder="you@example.com" aria-label="Email"><button class="btn primary" type="submit">Email me a link</button></div><p class="msg" role="status">${linkErr?'That link has expired or was already used. Request a new one.':''}</p></form>`);stamp('');return true}
  if(r.status===403){gate('No admin access','This account is signed in but its email is not in <code>ADMIN_EMAILS</code> on the API.','<button class="btn primary" data-signout>Sign out</button>');stamp('');return true}
  if(r.status!==200||!r.j){gate('Could not load '+what,esc((r.j&&r.j.error)||'The API did not answer. Check your connection and try again.'),'<button class="btn primary" data-retry>Try again</button>');stamp('');return true}
  return false}

      return`<tr><td>${esc(n)}</td><td>${l} / ${max}<span class="meter"><i style="width:${Math.min(100,l/max*100)}%"></i></span></td></tr>`}).join('')}</tbody></table></div></section>
    <section class="card"><h2>Heroes</h2><div class="sub">Unlocked heroes and classic wins with each</div>
      <div class="chips">${HEROES.map((h,i)=>`<span class="chip${s.chars.includes(i)?'':' off'}">${esc(h)}${s.wins_by[i]?' · '+fmtN(s.wins_by[i])+(s.wins_by[i]===1?' win':' wins'):''}</span>`).join('')}</div></section>`:''}
    ${p.boards?`<section class="card"><h2>Leaderboard</h2><div class="sub">Best run on each board</div><div class="tw"><table><thead><tr><th>Board</th><th>Rank</th><th>Best</th><th>Hero</th></tr></thead><tbody>${BOARDS.map(([k,n])=>{const b=p.boards[k];
      return`<tr><td>${esc(n)}</td><td>${b.rank?'#'+fmtN(b.rank)+' <span class="muted">of '+fmtN(b.total)+'</span>':'<span class="muted">not ranked</span>'}</td><td>${b.rank?esc(k==='kills'?fmtN(b.kills):fmtDur(b.time_s)+(k==='fastest'&&b.curse?' · curse '+b.curse:'')):''}</td><td>${b.hero?esc(heroLbl(b.hero)):''}</td></tr>`}).join('')}</tbody></table></div></section>`:''}
    ${s?codexCard(s.codex):''}
    <section class="card wide"><h2>Recent runs</h2><div class="sub">${fmtN(p.runs.total)} runs from ${devs.length===1?'this device':'all devices'}: ${fmtN(p.runs.wins)} wins, ${fmtN(p.runs.halloween)} Halloween, ${fmtN(p.runs.gold_earned)} gold earned${p.runs.crowns?', '+fmtN(p.runs.crowns)+' crowns':''}. Latest ${Math.min(p.runs.recent.length,50)} shown.</div>
      ${p.runs.recent.length?'<div class="tw"><table><thead><tr><th>When</th><th>Mode</th><th>Hero</th><th>Result</th><th>Time</th><th>Kills</th><th>Level</th><th>Gold</th><th>Detail</th></tr></thead><tbody>'+p.runs.recent.map(x=>
        `<tr><td>${esc(new Date(x.created_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',timeZone:TZ}))}</td><td>${x.mode==='halloween'?'Halloween':'Classic'}</td><td>${esc(heroLbl(x.hero))}</td><td>${esc(x.result)}</td><td>${fmtDur(x.time_s)}</td><td>${fmtN(x.kills)}</td><td>${x.level}</td><td>${fmtN(x.gold_earned)}</td><td>${esc(runDetail(x))}</td></tr>`).join('')+'</tbody></table></div>'
        :empty('No runs recorded yet. Runs are recorded from the telemetry release onwards.')}</section>
  </div>`;
  const ds=document.getElementById('devs');if(ds)ds.onclick=e=>{const b=e.target.closest('button');if(b){st.dev=Number(b.dataset.i);renderProfile()}}}
const runDetail=x=>x.mode==='halloween'?[x.crowns!=null&&x.crowns+' crowns',x.night_rank&&'night '+x.night_rank,x.death_cause&&(CAUSE[x.death_cause]||x.death_cause)].filter(Boolean).join(' · ')
  :[x.bosses!=null&&x.bosses+'/5 bosses',x.curse&&'curse '+x.curse].filter(Boolean).join(' · ');
function codexCard(cx){const it=Object.entries(cx.items||{}).filter(([,r])=>r.seen),en=Object.entries(cx.enemies||{}).filter(([,r])=>r.seen);
  const name=k=>heroLbl(k.replace(/^[a-z]+:/,'').replace(/_/g,'-'));
  return`<section class="card"><h2>Codex</h2><div class="sub">${fmtN(it.length)} items and ${fmtN(en.length)} enemies discovered</div>
    ${table(['Entry','Kind','Picked / killed'],it.map(([k,r])=>[name(k),'Item',fmtN(r.taken||0)]).concat(en.map(([k,r])=>[name(k),'Enemy',fmtN(r.kills||0)])))}</section>`}

// ===== views: #players, #player/user/<id>, #player/install/<id>, otherwise the overview =====
function route(){const m=location.hash.match(/^#player\/(user|install)\/([^/]+)$/);
  st.view=m?'profile':location.hash==='#players'?'players':'overview';redraw=null;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===(st.view==='overview'?'overview':'players')));
  rg.hidden=st.view==='profile';drawRanges();
  if(m)return loadProfile(m[1],decodeURIComponent(m[2]));
  return st.view==='players'?loadPlayers():loadStats()}
const load=route;
function render(){redraw=layout(st.data);const d=st.data;stamp(dayLbl(d.range.from)+' to '+dayLbl(addDays(d.range.to,-1))+' · updated '+new Date(d.generated_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}))}
async function who(){const r=await api('/me'),u=r.j&&r.j.user;const el=document.getElementById('who');
  el.innerHTML=u?`<button class="btn" id="signout">Sign out</button>`:'';if(u)document.getElementById('signout').onclick=signOut}

// Which deployment this page reads from. With the Neon integration, previews have their own database branch.
async function envBadge(){const r=await api('/health'),e=r.j&&r.j.env;if(!e)return;const el=document.getElementById('env');
  const lbl={production:'Production',preview:'Preview',development:'Local'}[e]||e;
  el.textContent=lbl;el.className='env'+(e==='production'?'':' nonprod');el.title=e==='production'?'Live player data':'Not the production deployment';el.hidden=false}

// ===== controls =====
const rg=document.getElementById('ranges');
// A single day picked on the Players view overrides the range until cleared.
const dayOn=()=>st.view==='players'&&st.day;
function drawRanges(){rg.innerHTML=RANGES.map(r=>`<button aria-pressed="${!dayOn()&&r.k===st.range}" data-k="${r.k}">${esc(r.n)}</button>`).join('')}
rg.onclick=e=>{const b=e.target.closest('button');if(!b||(b.dataset.k===st.range&&!dayOn()))return;st.range=b.dataset.k;st.day='';store.set('cs_admin_range',st.range);load()};
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(b)location.hash=b.dataset.v==='players'?'players':''};
addEventListener('hashchange',route);
document.getElementById('refresh').onclick=load;
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(redraw&&st.data)redraw()},120)});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(st.view==='overview'&&st.data)render()});

load();who();envBadge();
})();
</script>
</body>
