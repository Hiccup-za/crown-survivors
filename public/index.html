 killm:()=>{for(const e of G.en.slice())if(!e.boss&&!e.dead)killEnemy(e)},killa:()=>{for(const e of G.en.slice())if(!e.dead)killEnemy(e)},clr:()=>{G.eb=[];G.tele=[]},
 emb:()=>{G.hw.embers+=100;G.hw.got+=100},ritual:()=>{const h=G.hw;if(h.live.length)return dvMsg('A ritual is already live');h.embers=Math.max(h.embers,hwCost());h.cd=0;hwSummon()},rank:()=>{G.hw.rank++}};
const DV_FREE={close:1,report:1,run:1,hit:1,hud:1,type:1,elite:1,bi:1,hb:1};// UI-only: these don't mark the run
function dvDo(a,v,w){if(!dvA[a])return;if(a==='run'&&dvRun())return;if(!DV_FREE[a]){if(!dvRun())return dvMsg('Start a run first');dvMark()}try{dvA[a](v,w);SC=G?st():SC}catch(e){dvMsg('Failed: '+e.message);console.error(e)}if(DV.open&&a!=='close')dvMenu()}
let dvP=null;
function dvToggle(on){DV.open=on==null?!DV.open:on;if(DV.open)dvMenu();else if(dvP){dvP.remove();dvP=null}}
function dvMenu(){const g=dvRun()?G:null,hw=g&&g.hw,dis=g?'':'disabled',b=(a,l,v,on,ex)=>`<button data-a="${a}"${v!=null?` data-v="${v}"`:''}${ex!=null?` data-w="${ex}"`:''}${on?' class="on"':''} ${(ex==='any'?'':dis)}>${l}</button>`;
 const sel=(a,cur,opts,off)=>`<select data-a="${a}" ${off||''}>${opts.map(([v,n])=>`<option value="${v}"${String(v)===String(cur)?' selected':''}>${n}</option>`).join('')}</select>`;
 const items=(kind,T,lv)=>Object.keys(T).filter(k=>heroOk(T[k])).map(k=>`<div class="r"><span>${T[k].n}</span><b>${g?(kind==='w'&&g.evo[k]?'EVO':lv[k]||0):'-'}</b>${b(kind,'−',k,0,-1)}${b(kind,'+',k,0,1)}${kind==='w'?b('evo','Evo',k,g&&g.evo[k]):''}</div>`).join('');
 const st_=g?`${CH[g.char].n} · Lv ${g.lvl} · ${Math.round(g.p.hp)}/${Math.round(g.p.mhp)} HP${g.dbg?' · DEBUG RUN':''}`:'no run: start one';
 const html=`<div class="hd">DEBUG<i>${st_}</i>${b('close','✕',null,0,'any')}</div>${g?'':`<div class="r"><span>Start a run</span>${b('run','Classic',0,0,'any')}${b('run','Halloween',1,0,'any')}</div>`}
 <h4>RUN</h4><div class="r"><label><input type="checkbox" data-a="god" ${g&&g.god?'checked':''} ${dis}> God mode</label></div>
 <div class="r"><span>Time scale</span>${[0,.25,.5,1,2,4].map(v=>b('ts',v===0?'❚❚':v+'×',v,DV.ts===v)).join('')}</div>
 <div class="r">${b('step','Step 1 frame')}${b('t','+30s',30)}${b('t','+60s',60)}${hw?'':`<span></span>Phase ${sel('phase',g?g.phase:0,PHASE.map((_,i)=>[i,i+1]),dis)}`}</div>
 <h4>OVERLAYS</h4><div class="r"><label><input type="checkbox" data-a="hit" ${DV.hit?'checked':''}> Hitboxes</label><label><input type="checkbox" data-a="hud" ${DV.hud?'checked':''}> FPS + counts</label></div>
 <h4>PLAYER</h4><div class="r">${b('heal','Heal')}${b('lvl','+1 level')}${b('xp','+XP')}${b('gold','+100 gold')}${b('revive',g&&g.over&&!g.over.win?'Revive':'+1 revive')}</div>
 <h4>WEAPONS</h4>${items('w',WP,g?g.w:{})}<h4>PASSIVES</h4>${items('p',PS,g?g.ps:{})}<div class="r">${b('max','Max everything')}</div>
 <h4>SPAWN</h4><div class="r">${sel('type',DV.type,Object.keys(ETYPE).map(k=>[k,ENAME[k]||k]))}${[1,10,50].map(n=>b('en','×'+n,n)).join('')}<label><input type="checkbox" data-a="elite" ${DV.elite?'checked':''}> Elite</label></div>
 <div class="r">${sel('bi',DV.bi,BOSS.map((B,i)=>[i,(i+1)+'. '+B.n]))}${b('boss','Spawn boss')}</div>
 <div class="r">${sel('hb',DV.hb,Object.keys(HB).map(k=>[k,HB[k].n]))}${hw?b('rb','Summon'):'<span>ritual bosses: Halloween only</span>'}</div>
 <div class="r">${b('killm','Kill non-boss')}${b('killa','Kill everything')}${b('clr','Clear bullets')}</div>
 ${hw?`<h4>HALLOWEEN · ${hw.embers} embers · rank ${hw.rank} · ritual ${hw.step+1}</h4><div class="r">${b('emb','+100 embers')}${b('ritual','Next ritual now')}${b('rank','Night Rank +1')}</div>`:''}
 <h4>REPORT</h4><div class="r">${b('report','Report bug (F8)',null,0,'any')}<span>${DV.errs.length} error(s) logged</span></div>`;
 if(!dvP){dvP=dvEl('dvP');dvP.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.tagName==='SELECT'||t.disabled)return;if(t.tagName==='INPUT')return dvDo(t.dataset.a);dvDo(t.dataset.a,t.dataset.v,t.dataset.w)});
  dvP.addEventListener('change',e=>{if(e.target.tagName==='SELECT')dvDo(e.target.dataset.a,e.target.value)})}
 const sc=dvP.scrollTop;dvP.innerHTML=html;dvP.scrollTop=sc}
// ---- F8 bug report ----
const dvSum=()=>{const g=G;if(!g)return{scene};const b=g.boss||g.hw&&g.hw.live[0];
 return{mode:g.hw?'halloween':'classic',hero:CH[g.char].n,weapons:Object.keys(g.w).map(k=>WP[k].n+' '+(g.evo[k]?'EVO':g.w[k])).join(', '),passives:Object.keys(g.ps).map(k=>PS[k].n+' '+g.ps[k]).join(', '),
  t:+g.t.toFixed(2),level:g.lvl,hp:Math.round(g.p.hp)+'/'+Math.round(g.p.mhp),enemies:g.en.length,boss:b?dvName(b)+' '+Math.round(b.hp)+'/'+Math.round(b.mhp)+(b.bph?' P'+b.bph:''):null,
  phase:g.hw?'ritual '+(g.hw.step+1):g.phase+1,rank:g.hw?g.hw.rank:null,dbg:!!g.dbg,paused:!!g.paused,over:g.over?g.over.win?'won':'dead':null}};
function dvReport(){if(DV.modal)return;DV.modal=1;const ts=DV.ts;if(dvRun())DV.ts=0;let shot='';try{shot=cv.toDataURL('image/png')}catch(e){}
 const m=dvEl('dvM',`<div><b>Report a bug</b><img alt="screenshot"><textarea placeholder="What went wrong? What did you expect?"></textarea><div class="r"><i>${DV.errs.length} error(s) · ${G?'run state':'no run'} included</i><button data-k="c">Cancel</button><button data-k="s" class="on">Save (${/Mac/.test(navigator.platform)?'⌘':'Ctrl'}+Enter)</button></div></div>`);
 m.querySelector('img').src=shot;const ta=m.querySelector('textarea');setTimeout(()=>ta.focus(),0);
 const close=()=>{m.remove();DV.modal=0;DV.ts=ts},go_=async()=>{const r=dvBuild(ta.value.trim(),shot);close();await dvSend(r)};
 m.querySelector('[data-k=c]').onclick=close;m.querySelector('[data-k=s]').onclick=go_;
 ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();go_()}else if(e.key==='Escape')close()})}
function dvBuild(note,shot){const at=new Date(),slug=note.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
 return{id:at.toISOString().slice(0,19).replace(/:/g,'-')+(slug?'-'+slug:''),at:at.toISOString(),note,url:location.href,ua:navigator.userAgent,viewport:{W,H,DPR},scene,runMode,clock,
  version:document.documentElement.dataset.version||null,game:document.documentElement.dataset.game||null,replayOf:RPQ,summary:dvSum(),errors:DV.errs.slice(),
  state:{S:dvEnc(S),G:G?dvEnc(Object.assign({},G,{blood:null})):null},screenshot:shot}}
async function dvSend(r){try{const res=await fetch('/__dev/reports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(r)});if(!res.ok)throw new Error(res.status);const j=await res.json();dvMsg('Saved '+j.path)}
 catch(e){// no Workshop server here (vercel dev, a static server): download the whole report, screenshot inline
  const u=URL.createObjectURL(new Blob([JSON.stringify(r)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='report-'+r.id+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);dvMsg('No report server: downloaded report-'+r.id+'.json')}}
function dvKey(e){if(DV.modal&&e.target.tagName==='TEXTAREA')return;if(e.key==='`'||e.code==='Backquote'){e.preventDefault();dvToggle()}else if(e.key==='F8'){e.preventDefault();dvReport()}}
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;dvKey(e)});
// ---- replay: ?report=<id> loads that moment frozen; storage, cloud sync and telemetry are off (NOSAVE) ----
async function dvReplay(id){const bn=dvEl('dvR');bn.innerHTML=`<b>REPLAY</b><span>${id} · loading…</span>`;
 try{if(!/^[\w-]+$/.test(id))throw new Error('bad report id');const res=await fetch('/__dev/reports/'+id+'/report.json',{cache:'no-store'});if(!res.ok)throw new Error('report.json: HTTP '+res.status);const j=await res.json();
  S=dvDec(j.state.S);M=S.meta;G=j.state.G?dvDec(j.state.G):null;runMode=j.runMode||'classic';clock=j.clock||0;SC=null;trans=null;
  if(G){G.blood={t:new Map(),old:null,fade:0};G.dbg=1}scene=G||j.scene!=='play'?j.scene:'title';DV.ts=0;DV.used=1;
  bn.innerHTML='<b></b><span></span><button data-k="p">▶ Resume</button><button data-k="s">Step</button>';bn.querySelector('b').textContent='REPLAY '+j.id;bn.querySelector('span').textContent=j.note||'(no note)';bn.title=j.note||'';
  bn.querySelector('[data-k=p]').onclick=()=>{DV.ts=DV.ts?0:1;bn.querySelector('[data-k=p]').textContent=DV.ts?'❚❚ Freeze':'▶ Resume';if(DV.open)dvMenu()};bn.querySelector('[data-k=s]').onclick=()=>{DV.ts=0;DV.step=1;bn.querySelector('[data-k=p]').textContent='▶ Resume'}}
 catch(e){bn.querySelector('span').textContent=id+' · could not load: '+e.message;console.error(e)}}
if(RPQ)dvReplay(RPQ);
window.__dev={enc:dvEnc,dec:dvDec,report:dvReport,build:dvBuild,menu:dvToggle,do:dvDo,state:DV};
}
