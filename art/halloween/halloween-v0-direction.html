<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crown Survivors — Halloween Event V0 Direction</title>
<style>
  html, body { margin: 0; background: #140c09; }
  canvas { display: block; }
  #bar { position: fixed; left: 12px; bottom: 12px; z-index: 2; }
  button { font: bold 14px "Courier New", monospace; padding: 8px 14px; cursor: pointer; background: #c8452f; color: #fff3c4; border: 3px solid #3b2a1a; border-radius: 8px; }
</style>
</head>
<body>
<button id="bar" type="button">Download PNG</button>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
(() => {
const EXPORT = location.search.includes('export=1');
if (EXPORT) document.getElementById('bar').style.display = 'none';

const W = 1920, H = 1080;
const cv = document.getElementById('c');
const x = cv.getContext('2d');
const pal = { ink: '#3b2a1a', gold: '#ffd23f', paper: '#fff3c4' };
const OR = '#e07820';
const OR_D = '#c45e12';
const STEM = '#3f8a3a';

const FONT = {
  A:[14,17,31,17,17], E:[31,16,30,16,31], H:[17,17,31,17,17], L:[16,16,16,16,31],
  N:[17,25,21,19,17], O:[14,17,17,17,14], W:[17,17,21,27,17]
};

function pix(s, cx, cy, sz, col) {
  const p = sz / 5, adv = 6 * p, w = s.length * adv - p, X0 = cx - w / 2;
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < s.length; i++) {
      const g = FONT[s[i]];
      if (!g) continue;
      const X = X0 + i * adv;
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          if (!(g[r] & (16 >> c))) continue;
          if (pass < 2) {
            x.fillStyle = pass ? pal.ink : 'rgba(0,0,0,.4)';
            x.fillRect(X + c * p - p * .4, cy - 2.5 * p + r * p - p * .4 + (pass ? 0 : p * .65), p * 1.8, p * 1.8);
          } else {
            x.fillStyle = col;
            x.fillRect(X + c * p, cy - 2.5 * p + r * p, p, p);
          }
        }
      }
    }
  }
}

function txt(s, X, Y, sz, col, al, stroke) {
  x.font = 'bold ' + Math.round(sz) + 'px "Courier New", Courier, monospace';
  x.textAlign = al || 'center';
  x.textBaseline = 'middle';
  if (stroke !== false) {
    x.lineWidth = Math.max(3, sz * 0.14);
    x.strokeStyle = 'rgba(20,10,6,.85)';
    x.lineJoin = 'round';
    x.strokeText(s, X, Y);
  }
  x.fillStyle = col;
  x.fillText(s, X, Y);
}

function shadow(rx, y, ry) {
  x.fillStyle = 'rgba(0,0,0,.32)';
  x.beginPath();
  x.ellipse(0, y, rx, ry == null ? rx * 0.28 : ry, 0, 0, 7);
  x.fill();
}

function body(rx, ry, fill) {
  x.fillStyle = pal.ink;
  x.beginPath(); x.ellipse(0, 0, rx + 4, ry + 4, 0, 0, 7); x.fill();
  x.fillStyle = fill;
  x.beginPath(); x.ellipse(0, 0, rx, ry, 0, 0, 7); x.fill();
  x.fillStyle = 'rgba(255,255,255,.2)';
  x.beginPath(); x.ellipse(-rx * 0.34, -ry * 0.42, rx * 0.26, ry * 0.13, -0.55, 0, 7); x.fill();
}

function stem(rx, h) {
  const y0 = -rx * 0.82;
  const w = Math.max(8, rx * 0.2);
  x.fillStyle = pal.ink;
  x.fillRect(-w / 2 - 3, y0 - h, w + 6, h + 6);
  x.fillStyle = STEM;
  x.fillRect(-w / 2, y0 - h + 2, w, h);
  x.fillStyle = '#2d6a28';
  x.fillRect(-w / 2, y0 - 4, w, 6);
  x.fillStyle = pal.ink;
  x.beginPath(); x.ellipse(w * 0.9, y0 - h * 0.62, rx * 0.22, rx * 0.1, 0.7, 0, 7); x.fill();
  x.fillStyle = '#5aaa48';
  x.beginPath(); x.ellipse(w * 0.95, y0 - h * 0.64, rx * 0.17, rx * 0.07, 0.7, 0, 7); x.fill();
}

function eyes(cx, y, ew, eh, opt) {
  opt = opt || {};
  const gap = opt.gap == null ? ew * 0.28 : opt.gap;
  x.fillStyle = opt.glow ? '#ffe86a' : (opt.red ? '#ff4d4d' : '#fff');
  x.fillRect(cx - gap - ew, y, ew, eh);
  x.fillRect(cx + gap, y, ew, eh);
  x.fillStyle = opt.red ? '#3b120f' : pal.ink;
  const pw = ew * 0.38, ph = eh * 0.48, py = y + eh * 0.26;
  x.fillRect(cx - gap - ew * 0.68, py, pw, ph);
  x.fillRect(cx + gap + ew * 0.28, py, pw, ph);
}

function brows(cx, y, w, h, ang) {
  x.save();
  x.translate(cx - w * 0.15, y);
  x.rotate(-ang);
  x.fillStyle = pal.ink;
  x.fillRect(0, 0, w, h);
  x.restore();
  x.save();
  x.translate(cx + w * 0.15, y);
  x.rotate(ang);
  x.fillStyle = pal.ink;
  x.fillRect(-w, 0, w, h);
  x.restore();
}

function slit(cx, y, w, h) {
  x.fillStyle = pal.ink;
  x.fillRect(cx - w / 2, y, w, h);
}

function crown(r) {
  const cy = -r * 0.78;
  x.fillStyle = pal.gold;
  x.strokeStyle = pal.ink;
  x.lineWidth = Math.max(3, r * 0.045);
  x.lineJoin = 'round';
  x.beginPath();
  x.moveTo(-r * .5, cy);
  x.lineTo(-r * .55, cy - r * .58);
  x.lineTo(-r * .22, cy - r * .28);
  x.lineTo(0, cy - r * .78);
  x.lineTo(r * .22, cy - r * .28);
  x.lineTo(r * .55, cy - r * .58);
  x.lineTo(r * .5, cy);
  x.closePath();
  x.fill();
  x.stroke();
  x.fillStyle = '#c8452f';
  x.fillRect(-r * 0.055, cy - r * 0.22, r * 0.11, r * 0.12);
}

function stemCrown(r) {
  const base = -r * 0.78;
  for (let i = 0; i < 5; i++) {
    const t = (i - 2) / 2;
    const px = t * r * 0.62;
    const h = r * (0.34 + (1 - Math.abs(t)) * 0.28);
    x.fillStyle = pal.ink;
    x.beginPath();
    x.moveTo(px - r * 0.09, base + 4);
    x.lineTo(px, base - h);
    x.lineTo(px + r * 0.09, base + 4);
    x.closePath();
    x.fill();
    x.fillStyle = i === 2 ? '#5aaa48' : STEM;
    x.beginPath();
    x.moveTo(px - r * 0.055, base + 2);
    x.lineTo(px, base - h + r * 0.06);
    x.lineTo(px + r * 0.055, base + 2);
    x.closePath();
    x.fill();
  }
}

function flame(ox, oy, s) {
  x.save();
  x.translate(ox, oy);
  x.fillStyle = pal.ink;
  x.beginPath();
  x.moveTo(0, -s);
  x.lineTo(s * 0.58, s * 0.05);
  x.lineTo(s * 0.3, s * 0.9);
  x.lineTo(-s * 0.3, s * 0.9);
  x.lineTo(-s * 0.58, s * 0.05);
  x.closePath();
  x.fill();
  x.fillStyle = '#ff8a1e';
  x.beginPath();
  x.moveTo(0, -s * 0.72);
  x.lineTo(s * 0.38, s * 0.08);
  x.lineTo(s * 0.16, s * 0.66);
  x.lineTo(-s * 0.16, s * 0.66);
  x.lineTo(-s * 0.38, s * 0.08);
  x.closePath();
  x.fill();
  x.fillStyle = pal.gold;
  x.beginPath();
  x.moveTo(0, -s * 0.1);
  x.lineTo(s * 0.16, s * 0.32);
  x.lineTo(0, s * 0.52);
  x.lineTo(-s * 0.16, s * 0.32);
  x.closePath();
  x.fill();
  x.restore();
}

function carveTri(cx, cy, s, col) {
  x.fillStyle = col;
  x.beginPath();
  x.moveTo(cx, cy + s * 0.75);
  x.lineTo(cx - s, cy - s * 0.45);
  x.lineTo(cx + s, cy - s * 0.45);
  x.closePath();
  x.fill();
}

function jag(y, w, h, col) {
  x.fillStyle = col;
  x.beginPath();
  x.moveTo(-w, y);
  x.lineTo(-w * 0.55, y + h);
  x.lineTo(-w * 0.15, y + h * 0.15);
  x.lineTo(w * 0.2, y + h);
  x.lineTo(w * 0.55, y + h * 0.1);
  x.lineTo(w, y + h * 0.85);
  x.lineTo(w * 0.72, y - h * 0.2);
  x.lineTo(-w * 0.72, y - h * 0.2);
  x.closePath();
  x.fill();
}

function pip(r) {
  shadow(r * 0.85, r * 0.78);
  x.save();
  x.rotate(-0.12);
  body(r, r * 0.9, OR);
  stem(r, r * 0.42);
  eyes(0, -r * 0.16, r * 0.32, r * 0.34);
  slit(0, r * 0.28, r * 0.28, r * 0.07);
  x.restore();
}

function shadeBat(r) {
  shadow(r * 1.15, r * 0.85, r * 0.26);
  const f = r * 0.22;
  x.fillStyle = pal.ink;
  x.beginPath();
  x.moveTo(0, r * 0.05); x.lineTo(-r * 2.05, -r * 0.62 - f); x.lineTo(-r * 0.82, r * 0.58); x.closePath();
  x.moveTo(0, r * 0.05); x.lineTo(r * 2.05, -r * 0.62 - f); x.lineTo(r * 0.82, r * 0.58); x.closePath();
  x.fill();
  x.fillStyle = '#241833';
  x.beginPath();
  x.moveTo(0, r * 0.08); x.lineTo(-r * 1.78, -r * 0.4 - f); x.lineTo(-r * 0.78, r * 0.4); x.closePath();
  x.moveTo(0, r * 0.08); x.lineTo(r * 1.78, -r * 0.4 - f); x.lineTo(r * 0.78, r * 0.4); x.closePath();
  x.fill();
  body(r * 0.72, r * 0.66, OR);
  stem(r * 0.72, r * 0.28);
  eyes(0, -r * 0.1, r * 0.2, r * 0.2, { red: 1, gap: r * 0.08 });
}

function candySkel(r) {
  shadow(r * 0.85, r * 1.22, r * 0.22);
  x.fillStyle = pal.ink;
  x.fillRect(-r * 0.48, r * 0.92, r * 0.26, r * 0.42);
  x.fillRect(r * 0.2, r * 0.92, r * 0.26, r * 0.42);
  x.fillStyle = '#e8e0cc';
  x.fillRect(-r * 0.42, r * 0.92, r * 0.16, r * 0.34);
  x.fillRect(r * 0.26, r * 0.92, r * 0.16, r * 0.34);
  x.fillStyle = pal.ink;
  x.fillRect(r * 0.62, -r * 0.02, r * 0.5, r * 0.2);
  x.fillStyle = '#8a8a9a';
  x.fillRect(r * 0.66, r * 0.03, r * 0.4, r * 0.1);
  x.fillStyle = pal.ink;
  x.fillRect(-r * 0.62, -r * 0.08, r * 1.24, r * 1.12);
  x.fillStyle = '#e8e0cc';
  x.fillRect(-r * 0.5, 0, r, r * 0.92);
  x.fillStyle = pal.ink;
  x.fillRect(-r * 0.07, r * 0.08, r * 0.14, r * 0.72);
  for (let i = 0; i < 3; i++) x.fillRect(-r * 0.36, r * 0.18 + i * r * 0.22, r * 0.72, r * 0.06);
  x.save();
  x.translate(0, -r * 0.62);
  body(r * 0.74, r * 0.68, OR);
  stem(r * 0.74, r * 0.3);
  eyes(0, -r * 0.06, r * 0.2, r * 0.22);
  x.restore();
}

function jackWisp(r) {
  x.fillStyle = 'rgba(255,180,40,.2)';
  x.beginPath(); x.arc(0, -r * 0.1, r * 1.25, 0, 7); x.fill();
  flame(-r * 0.85, -r * 1.15, r * 0.42);
  flame(0, -r * 1.55, r * 0.55);
  flame(r * 0.8, -r * 1.05, r * 0.36);
  x.globalAlpha = 0.45;
  shadow(r * 0.7, r * 1.15, r * 0.18);
  x.globalAlpha = 1;
  body(r, r * 0.94, '#ee8a28');
  stem(r, r * 0.34);
  carveTri(-r * 0.28, -r * 0.02, r * 0.24, pal.ink);
  carveTri(r * 0.28, -r * 0.02, r * 0.24, pal.ink);
  carveTri(-r * 0.28, -r * 0.02, r * 0.17, '#ffe86a');
  carveTri(r * 0.28, -r * 0.02, r * 0.17, '#ffe86a');
  jag(r * 0.32, r * 0.42, r * 0.2, pal.ink);
  jag(r * 0.34, r * 0.34, r * 0.14, '#ffe86a');
}

function vineGourd(r) {
  shadow(r * 0.9, r * 0.85);
  x.lineCap = 'round';
  const tips = [];
  for (let pass = 0; pass < 2; pass++) {
    x.strokeStyle = pass ? STEM : pal.ink;
    x.lineWidth = pass ? 8 : 13;
    for (let i = 0; i < 4; i++) {
      const a = -2.35 + i * 1.15;
      const x2 = Math.cos(a) * r * 1.9;
      const y2 = Math.sin(a) * r * 1.45;
      const cx = Math.cos(a + 0.75) * r * 1.15;
      const cy = Math.sin(a + 0.75) * r * 0.95;
      x.beginPath();
      x.moveTo(Math.cos(a) * r * 0.25, Math.sin(a) * r * 0.15);
      x.quadraticCurveTo(cx, cy, x2, y2);
      x.stroke();
      if (pass) tips.push([x2, y2, a]);
    }
  }
  for (const [x2, y2, a] of tips) {
    x.save();
    x.translate(x2, y2);
    x.rotate(a);
    x.fillStyle = pal.ink;
    x.beginPath(); x.moveTo(0, 0); x.lineTo(14, -6); x.lineTo(11, 5); x.closePath(); x.fill();
    x.fillStyle = '#e85a9a';
    x.beginPath(); x.moveTo(2, 0); x.lineTo(11, -4); x.lineTo(9, 3); x.closePath(); x.fill();
    x.restore();
  }
  body(r, r * 0.92, OR);
  stem(r, r * 0.4);
  eyes(0, -r * 0.08, r * 0.28, r * 0.3);
  slit(0, r * 0.32, r * 0.26, r * 0.07);
}

function patchLord(r) {
  const rx = r * 1.12, ry = r * 0.96;
  shadow(rx * 0.9, ry * 0.82);
  body(rx, ry, '#d86a18');
  stemCrown(r);
  brows(0, -ry * 0.42, rx * 0.38, ry * 0.07, 0.22);
  eyes(0, -ry * 0.08, rx * 0.26, ry * 0.28);
  slit(0, ry * 0.38, rx * 0.32, ry * 0.07);
}

function hollowTwin(r) {
  const ry = r * 0.96;
  shadow(r * 0.9, ry * 0.82);
  x.fillStyle = pal.ink;
  x.beginPath(); x.ellipse(0, 0, r + 4, ry + 4, 0, 0, 7); x.fill();
  x.fillStyle = '#ee8a28';
  x.beginPath(); x.ellipse(0, 0, r, ry, 0, 0, 7); x.fill();
  x.save();
  x.beginPath(); x.rect(0, -ry - 6, r + 8, ry * 2 + 12); x.clip();
  x.fillStyle = OR_D;
  x.beginPath(); x.ellipse(0, 0, r, ry, 0, 0, 7); x.fill();
  x.restore();
  x.fillStyle = 'rgba(255,255,255,.2)';
  x.beginPath(); x.ellipse(-r * 0.38, -ry * 0.4, r * 0.2, ry * 0.1, -0.5, 0, 7); x.fill();
  stem(r * 0.9, r * 0.36);
  x.fillStyle = pal.ink;
  x.fillRect(-3, -ry + 8, 6, ry * 2 - 16);
  eyes(-r * 0.38, -ry * 0.1, r * 0.18, r * 0.2, { gap: r * 0.05 });
  slit(-r * 0.38, ry * 0.28, r * 0.2, r * 0.055);
  brows(r * 0.36, -ry * 0.38, r * 0.22, r * 0.055, 0.3);
  eyes(r * 0.38, -ry * 0.02, r * 0.17, r * 0.19, { glow: 1, gap: r * 0.045 });
  x.save();
  x.translate(r * 0.38, ry * 0.32);
  jag(0, r * 0.16, r * 0.1, '#ffe86a');
  x.restore();
}

function harvestWheel(r) {
  const R = r * 1.72;
  shadow(R * 0.72, R * 0.55, R * 0.16);
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * (Math.PI * 2 / 10);
    const c = Math.cos(a), s = Math.sin(a);
    const p = Math.cos(a + Math.PI / 2), q = Math.sin(a + Math.PI / 2);
    const b = R * 0.92, tip = R * 1.18, hw = R * 0.07;
    x.fillStyle = pal.ink;
    x.beginPath();
    x.moveTo(c * (b - 4) + p * (hw + 3), s * (b - 4) + q * (hw + 3));
    x.lineTo(c * (tip + 6), s * (tip + 6));
    x.lineTo(c * (b - 4) - p * (hw + 3), s * (b - 4) - q * (hw + 3));
    x.closePath();
    x.fill();
    x.fillStyle = '#8b5a2b';
    x.beginPath();
    x.moveTo(c * b + p * hw, s * b + q * hw);
    x.lineTo(c * tip, s * tip);
    x.lineTo(c * b - p * hw, s * b - q * hw);
    x.closePath();
    x.fill();
  }
  x.lineWidth = R * 0.2;
  x.strokeStyle = pal.ink;
  x.beginPath(); x.arc(0, 0, R * 0.78, 0, 7); x.stroke();
  x.lineWidth = R * 0.12;
  x.strokeStyle = '#a56b38';
  x.beginPath(); x.arc(0, 0, R * 0.78, 0, 7); x.stroke();
  x.strokeStyle = '#6a431f';
  x.lineWidth = Math.max(4, R * 0.045);
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 4;
    x.beginPath();
    x.moveTo(Math.cos(a) * r * 0.85, Math.sin(a) * r * 0.85);
    x.lineTo(Math.cos(a) * R * 0.7, Math.sin(a) * R * 0.7);
    x.moveTo(-Math.cos(a) * r * 0.85, -Math.sin(a) * r * 0.85);
    x.lineTo(-Math.cos(a) * R * 0.7, -Math.sin(a) * R * 0.7);
    x.stroke();
  }
  body(r, r * 0.92, OR);
  stem(r, r * 0.32);
  eyes(0, -r * 0.06, r * 0.26, r * 0.28);
}

function nightGourd(r) {
  x.fillStyle = 'rgba(255,170,50,.16)';
  x.beginPath(); x.arc(0, 0, r * 1.35, 0, 7); x.fill();
  shadow(r * 0.95, r * 0.82);
  body(r * 1.05, r, '#c65612');
  x.strokeStyle = pal.ink;
  x.lineWidth = Math.max(4, r * 0.045);
  x.lineCap = 'round';
  x.beginPath();
  x.moveTo(-r * 0.62, -r * 0.28);
  x.quadraticCurveTo(-r * 0.82, r * 0.08, -r * 0.5, r * 0.5);
  x.stroke();
  x.beginPath();
  x.moveTo(r * 0.58, -r * 0.22);
  x.quadraticCurveTo(r * 0.82, r * 0.02, r * 0.62, r * 0.28);
  x.stroke();
  stem(r, r * 0.28);
  crown(r);
  brows(0, -r * 0.42, r * 0.4, r * 0.065, 0.26);
  eyes(0, -r * 0.1, r * 0.24, r * 0.26, { glow: 1 });
  const my = r * 0.4, mw = r * 0.4, mh = r * 0.15;
  const teeth = (yy, ww, hh, col) => {
    x.fillStyle = col;
    x.beginPath();
    x.moveTo(-ww, yy);
    x.lineTo(-ww * 0.62, yy + hh);
    x.lineTo(-ww * 0.3, yy + hh * 0.12);
    x.lineTo(0, yy + hh);
    x.lineTo(ww * 0.3, yy + hh * 0.12);
    x.lineTo(ww * 0.62, yy + hh);
    x.lineTo(ww, yy);
    x.closePath();
    x.fill();
  };
  teeth(my - 4, mw + 8, mh + 10, pal.ink);
  teeth(my, mw, mh, '#ffe86a');
}

function soulEmber() {
  x.fillStyle = 'rgba(255,176,48,.4)';
  x.beginPath(); x.arc(0, 1, 13, 0, 7); x.fill();
  x.fillStyle = pal.ink;
  x.beginPath();
  x.moveTo(0, -13); x.lineTo(8, -1); x.lineTo(5, 11); x.lineTo(-5, 11); x.lineTo(-8, -1);
  x.closePath(); x.fill();
  x.fillStyle = OR;
  x.beginPath();
  x.moveTo(0, -10); x.lineTo(6, -1); x.lineTo(3.5, 9); x.lineTo(-3.5, 9); x.lineTo(-6, -1);
  x.closePath(); x.fill();
  x.fillStyle = pal.gold;
  x.beginPath();
  x.moveTo(0, -3); x.lineTo(2.6, 2); x.lineTo(0, 7); x.lineTo(-2.6, 2);
  x.closePath(); x.fill();
}

function at(cx, cy, fn) {
  x.save();
  x.translate(cx, cy);
  fn();
  x.restore();
}

function tag(name, role, cx, cy) {
  txt(name, cx, cy, 26, pal.paper);
  txt(role, cx, cy + 30, 15, 'rgba(255,228,180,.8)', 'center', false);
}

function field() {
  x.fillStyle = '#140c09';
  x.fillRect(0, 0, W, H);
  const g = x.createRadialGradient(1040, 620, 40, 1000, 640, 1100);
  g.addColorStop(0, '#3a2216');
  g.addColorStop(0.45, '#24150e');
  g.addColorStop(1, '#100a07');
  x.fillStyle = g;
  x.fillRect(0, 0, W, H);
}

function draw() {
  field();
  pix('HALLOWEEN', W / 2, 54, 42, pal.gold);
  txt('event direction', W / 2, 96, 16, 'rgba(255,220,170,.72)', 'center', false);

  at(155, 320, () => pip(66));
  tag('Pip', 'rolls', 155, 452);

  at(455, 332, () => shadeBat(58));
  tag('Shade Bat', 'winged', 455, 452);
